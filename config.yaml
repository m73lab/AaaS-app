server:
  listen: ":8080"

upstream:
  # Empty api_key => mock mode (echoes the anonymized prompt so you can see
  # the round-trip). Set base_url + api_key to forward to a real provider.
  base_url: "https://api.openai.com/v1"
  api_key: ""
  timeout: 30

vault:
  type: "memory"            # memory | redis
  redis_addr: "localhost:6379"
  redis_password: ""
  redis_db: 0
  redis_tls: false          # enable + provide certs below for mutual TLS
  redis_client_cert: ""     # PEM client cert (mTLS auth to Redis)
  redis_client_key: ""      # PEM client key
  redis_ca_cert: ""         # PEM CA to verify the Redis server cert
  ttl_seconds: 300
  kms:
    # rotating: versioned KEKs derived from the master key; supports live
    # rotation (POST /v1/admin/rotate-kek). local: single KEK (no rotation).
    type: "rotating"
    master_key_env: "AaaS_MASTER_KEY"
    version_env: "AaaS_KEK_VERSION"

detect:
  enable_phone: true
  heuristic_ner: true       # interim capitalized-word NER (until Presidio)
  presidio_url: ""          # e.g. http://localhost:5002/analyze (see deploy/presidio)
  presidio_lang: "es"
  person_names:
    - "María González"
    - "Maria Gonzalez"
    - "Juan Pérez"
    - "Juan Perez"
    - "Acme Corp"
  dictionary: []

policy:
  default_action: "reversible"
  fail_closed: false        # true => reject if detection errors
  rules:
    # Forbid egress of card numbers entirely (never send to the LLM).
    - categories: ["CREDIT_CARD"]
      action: "block"
    # Structured identifiers are reversible (we may need them back).
    - categories: ["EMAIL", "RUT", "PHONE", "IPV4"]
      action: "reversible"
    # Free-text proper nouns use vault-less FPE: anonymous but stable +
    # format preserving, with no central PII store (GDPR-friendly).
    - categories: ["PERSON", "ORG", "CUSTOM", "LOCATION"]
      action: "reversible"

audit:
  enabled: true
  path: "audit.log"         # PII-free JSON lines; empty => stderr
