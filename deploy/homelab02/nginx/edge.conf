# mTLS edge for the AaaS stack.
#  - 5443: mutually-authenticated reverse proxy to Presidio (internal).
#  - 5444: mutually-authenticated endpoint for CLIENT API + admin rotation.
# Clients must present a certificate signed by our CA (ca.crt).
events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Presidio NER over mTLS (internal; the AaaS proxy is the only caller).
    server {
        listen 5443 ssl;
        ssl_certificate     /certs/presidio-server.crt;
        ssl_certificate_key /certs/presidio-server.key;
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client on;

        location / {
            set $presidio "presidio-analyzer:3000";
            proxy_pass http://$presidio;
            proxy_set_header Host $host;
        }
    }

    # Client API + Admin over mTLS (all /v1/* traffic to the AaaS proxy).
    server {
        listen 5444 ssl;
        ssl_certificate     /certs/presidio-server.crt;
        ssl_certificate_key /certs/presidio-server.key;
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client on;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        location / {
            set $upstream "proxy:8080";
            proxy_pass http://$upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE streaming support
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
        }
    }
}
